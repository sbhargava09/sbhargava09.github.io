<title>Aqueous Drainage Animation &mdash; Angle Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,400;1,400&family=DM+Sans:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f0f4f5; --bg-mid:#e4edf0; --bg-dark:#d4e3e8;
    --ink:#0d1f2d; --ink-mid:#3a5060; --ink-light:#7a9aaa;
    --rule: rgba(13,31,45,0.13);
    --accent:#0a7e8c; --accent-dark:#065f6b; --accent-light:#e0f2f4;
    --warn:#a85d3e; --warn-tint:#f5e9e3;
    --f-serif:'Cormorant Garamond', Georgia, serif;
    --f-sans:'DM Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1a20; --bg-mid:#132630; --bg-dark:#1a323f;
      --ink:#eaf1f3; --ink-mid:#b7c9d1; --ink-light:#6f8b98;
      --rule: rgba(234,241,243,0.12);
      --accent:#3fb8c4; --accent-dark:#6fd0d9; --accent-light:#173842;
      --warn:#e0916d; --warn-tint:#2c1f19;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1a20; --bg-mid:#132630; --bg-dark:#1a323f;
    --ink:#eaf1f3; --ink-mid:#b7c9d1; --ink-light:#6f8b98;
    --rule: rgba(234,241,243,0.12);
    --accent:#3fb8c4; --accent-dark:#6fd0d9; --accent-light:#173842;
    --warn:#e0916d; --warn-tint:#2c1f19;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--f-sans);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100svh; padding:clamp(1.5rem,4vw,3rem); gap:1.5rem;
  }

  .wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:1.1rem; }

  .eyebrow{
    font-size:0.7rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--accent); text-align:center;
  }
  h1{
    font-family:var(--f-serif); font-weight:400; font-style:italic; font-size:clamp(1.5rem,3.4vw,2rem);
    text-align:center; margin:0; color:var(--ink); text-wrap:balance;
  }

  .stage{
    position:relative; width:100%; aspect-ratio:1000/1160; overflow:hidden;
    background:var(--bg-mid); border:1px solid var(--rule);
  }
  .stage svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .label-group{ opacity:0; animation: fadeInUp .6s ease forwards; }
  .label-group text{ font-family:var(--f-sans); }
  .label-group.l1{ animation-delay:.3s; }
  .label-group.l2{ animation-delay:.5s; }
  .label-group.l3{ animation-delay:.7s; }
  .label-group.l4{ animation-delay:.9s; }
  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:none; }
  }

  .callout-line{
    stroke:var(--ink-light); stroke-width:1; fill:none;
    stroke-dasharray:80; stroke-dashoffset:80;
    animation: drawLine .7s ease forwards;
    animation-delay: inherit;
  }
  @keyframes drawLine{ to{ stroke-dashoffset:0; } }

  /* cornea: fades in on load */
  .cornea-shape{
    fill:var(--accent-light); stroke:var(--accent-dark); stroke-width:2;
    fill-opacity:0; stroke-opacity:0;
    animation: corneaIn 1s ease forwards;
    animation-delay:.15s;
  }
  @keyframes corneaIn{ to{ fill-opacity:0.55; stroke-opacity:1; } }

  .tm-tick{
    stroke:var(--accent-dark); stroke-width:1.8; stroke-linecap:round;
    opacity:0; animation: fadeIn .5s ease forwards; animation-delay:.45s;
  }
  @keyframes fadeIn{ to{ opacity:1; } }

  .flow-dot{ offset-rotate:auto; }
  .flow-dot-top{
    offset-path: path("M 595 150 Q 545 280 580 400 Q 600 450 614 475 Q 680 420 696 300 Q 660 200 615 140");
    animation: flow 5s linear infinite;
  }
  .flow-dot-bottom{
    offset-path: path("M 595 970 Q 545 840 580 720 Q 600 670 614 645 Q 680 700 696 820 Q 660 920 615 980");
    animation: flow 5s linear infinite;
  }
  /* three arrows travel back to back (small stagger), then everyone pauses (72%-100% of the
     5s cycle = ~1.4s) before the whole group sets off again */
  @keyframes flow{
    0%{ offset-distance:0%; opacity:0; }
    6%{ opacity:1; }
    66%{ opacity:1; }
    72%{ offset-distance:100%; opacity:0; }
    100%{ offset-distance:100%; opacity:0; }
  }

  .caption{
    min-height:2.6em; text-align:center; font-size:0.98rem; color:var(--ink-mid);
    line-height:1.55; display:flex; align-items:center; justify-content:center;
  }
  .caption span{ opacity:0; transition:opacity .5s ease; position:absolute; max-width:56ch; padding:0 1rem; }
  .caption span.active{ opacity:1; position:relative; }

  @media (prefers-reduced-motion: reduce){
    .label-group, .callout-line, .flow-dot, .cornea-shape, .tm-tick{
      animation-duration:.01ms !important;
    }
    .flow-dot{ opacity:0 !important; }
  }
</style>

<div class="wrap">
  <p class="eyebrow">Concept preview &mdash; not yet on the page</p>
  <h1>Where the eye drains its fluid</h1>

  <div class="stage">
    <svg viewBox="0 0 1000 1160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="tmArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="var(--accent-dark)"/>
        </marker>
      </defs>

      <!-- iridocorneal angle cross-section, symmetric top/bottom -->
      <g>

        <!-- sclera -->
        <path d="M 615 137 C 520 90, 380 60, 250 70" fill="none" stroke="var(--ink-light)" stroke-width="7" stroke-linecap="round"/>
        <path d="M 615 983 C 520 1030, 380 1060, 250 1050" fill="none" stroke="var(--ink-light)" stroke-width="7" stroke-linecap="round"/>

        <!-- cornea: one continuous dome -->
        <path class="cornea-shape"
              d="M 615 137 Q 880 250 900 560 Q 880 870 615 983
                 L 605 970 Q 845 860 860 560 Q 845 260 605 150 Z"/>

        <!-- anterior chamber tint -->
        <path d="M 622 469 Q 696 300 570 132 L 605 150 Q 845 260 860 560 Q 845 860 605 970 L 570 988 Q 696 820 622 651 L 622 469 Z"
              fill="var(--accent-light)" opacity="0.4"/>

        <!-- lens: ovoid, not a sphere -- its center is the mirror axis for the angle above/below -->
        <ellipse cx="500" cy="560" rx="112" ry="238" fill="var(--bg-mid)" stroke="var(--ink-light)" stroke-width="2.5"/>

        <!-- lens zonules -->
        <g stroke="var(--ink-light)" stroke-width="1.3" opacity="0.75">
          <line x1="558" y1="118" x2="510" y2="324"/>
          <line x1="568" y1="133" x2="519" y2="326"/>
          <line x1="580" y1="142" x2="529" y2="330"/>
          <line x1="558" y1="1002" x2="510" y2="796"/>
          <line x1="568" y1="987" x2="519" y2="794"/>
          <line x1="580" y1="978" x2="529" y2="790"/>
        </g>

        <!-- ciliary body: tiny, attaches on the scleral side of the limbus -->
        <path d="M 617 140 C 600 118, 575 108, 558 118
                 Q 550 124 557 134 Q 547 140 557 149
                 Q 566 156 578 148 Q 594 154 604 142 Z"
              fill="var(--accent)" opacity="0.85"/>
        <path d="M 617 980 C 600 1002, 575 1012, 558 1002
                 Q 550 996 557 986 Q 547 980 557 971
                 Q 566 964 578 972 Q 594 966 604 978 Z"
              fill="var(--accent)" opacity="0.85"/>
        <g stroke="var(--accent-dark)" stroke-width="1" opacity="0.55">
          <path d="M 560 122 L 566 136"/>
          <path d="M 571 133 L 576 146"/>
          <path d="M 584 138 L 588 150"/>
          <path d="M 560 998 L 566 984"/>
          <path d="M 571 987 L 576 974"/>
          <path d="M 584 982 L 588 970"/>
        </g>

        <!-- iris: rooted where the ciliary body meets the zonules, gentle convex curve toward the
             cornea, tip stops just short of the lens (that gap is the aqueous fluid's path through) -->
        <path d="M 570 132 Q 696 300 622 469 Q 631 300 570 132 Z" fill="var(--accent)" opacity="0.94"/>
        <path d="M 610 200 Q 675 300 630 420" fill="none" stroke="var(--accent-dark)" stroke-width="1" opacity="0.35"/>
        <path d="M 570 988 Q 696 820 622 651 Q 631 820 570 988 Z" fill="var(--accent)" opacity="0.94"/>
        <path d="M 610 920 Q 675 820 630 700" fill="none" stroke="var(--accent-dark)" stroke-width="1" opacity="0.35"/>

        <!-- scleral spur -->
        <path d="M 613 133 L 630 143 L 611 152 Z" fill="var(--ink-light)" opacity="0.9"/>
        <path d="M 613 987 L 630 977 L 611 968 Z" fill="var(--ink-light)" opacity="0.9"/>

        <!-- trabecular meshwork: short strands embedded right at the corneoscleral junction,
             a second layer at 90° gives it a woven mesh texture -->
        <g class="tm-tick">
          <path d="M 604 133 L 615 145"/>
          <path d="M 611 131 L 622 143"/>
          <path d="M 618 131 L 629 143"/>
          <path d="M 604 144 L 615 134"/>
          <path d="M 611 142 L 622 132"/>
          <path d="M 618 142 L 629 132"/>
          <path d="M 604 987 L 615 975"/>
          <path d="M 611 989 L 622 977"/>
          <path d="M 618 989 L 629 977"/>
          <path d="M 604 976 L 615 986"/>
          <path d="M 611 978 L 622 988"/>
          <path d="M 618 978 L 629 988"/>
        </g>

        <!-- animated flow arrows (current-map style): ciliary body -> through the iris/lens gap
             -> anterior chamber -> meshwork. offset-rotate:auto keeps each arrow pointed the
             way it's traveling. three per path, sent out back to back (tight stagger), then the
             whole group pauses together before setting off again. -->
        <path class="flow-dot flow-dot-top" style="animation-delay:2.2s" d="M -9 0 L 7 0 M 7 0 L 1 -5 M 7 0 L 1 5" fill="none" stroke="var(--accent-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="flow-dot flow-dot-top" style="animation-delay:2.4s" d="M -9 0 L 7 0 M 7 0 L 1 -5 M 7 0 L 1 5" fill="none" stroke="var(--accent-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="flow-dot flow-dot-top" style="animation-delay:2.6s" d="M -9 0 L 7 0 M 7 0 L 1 -5 M 7 0 L 1 5" fill="none" stroke="var(--accent-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="flow-dot flow-dot-bottom" style="animation-delay:2.2s" d="M -9 0 L 7 0 M 7 0 L 1 -5 M 7 0 L 1 5" fill="none" stroke="var(--accent-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="flow-dot flow-dot-bottom" style="animation-delay:2.4s" d="M -9 0 L 7 0 M 7 0 L 1 -5 M 7 0 L 1 5" fill="none" stroke="var(--accent-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="flow-dot flow-dot-bottom" style="animation-delay:2.6s" d="M -9 0 L 7 0 M 7 0 L 1 -5 M 7 0 L 1 5" fill="none" stroke="var(--accent-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- callouts: cornea, iris, lens, and the trabecular meshwork -->
        <g class="label-group l1">
          <text x="928" y="565" text-anchor="middle" font-size="16" fill="var(--ink-mid)">Cornea</text>
        </g>
        <g class="label-group l2">
          <path class="callout-line" d="M 665 800 L 770 740"/>
          <text x="776" y="745" text-anchor="start" font-size="16" fill="var(--ink)" font-weight="500">Iris</text>
        </g>
        <g class="label-group l3">
          <text x="500" y="565" text-anchor="middle" font-size="17" fill="var(--ink-mid)">Lens</text>
        </g>
        <g class="label-group l4">
          <path class="callout-line" style="stroke:var(--accent-dark); stroke-width:1.5" d="M 700 72 L 624 136" fill="none" marker-end="url(#tmArrow)"/>
          <text x="706" y="63" text-anchor="start" font-size="15" fill="var(--accent-dark)">Trabecular meshwork (drainage system)</text>
        </g>
      </g>
    </svg>
  </div>

  <div class="caption">
    <span data-c="detail1" class="active">Fluid is produced by the ciliary processes, behind the iris.</span>
    <span data-c="detail2">It flows forward, through a narrow gap between the iris and the lens.</span>
    <span data-c="detail3">At the iridocorneal angle, it drains outward through the trabecular meshwork.</span>
  </div>
</div>

<script>
  const captions = [...document.querySelectorAll('.caption span')];
  const durations = [3400, 3400, 5200];
  let idx = 0;

  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function cycleCaptions(){
    while (true){
      captions.forEach((s,i) => s.classList.toggle('active', i === idx));
      await wait(durations[idx]);
      idx = (idx + 1) % captions.length;
    }
  }
  cycleCaptions();
</script>
