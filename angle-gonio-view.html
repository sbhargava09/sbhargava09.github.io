<title>The Angle Through a Goniolens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f0f4f5; --bg-mid:#e4edf0;
    --ink:#0d1f2d; --ink-mid:#3a5060;
    --rule: rgba(13,31,45,0.13);
    --accent:#0a7e8c;
    --f-serif:'Cormorant Garamond', Georgia, serif;
    --f-sans:'DM Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1a20; --bg-mid:#132630;
      --ink:#eaf1f3; --ink-mid:#b7c9d1;
      --rule: rgba(234,241,243,0.12); --accent:#3fb8c4;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1a20; --bg-mid:#132630;
    --ink:#eaf1f3; --ink-mid:#b7c9d1;
    --rule: rgba(234,241,243,0.12); --accent:#3fb8c4;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--f-sans);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100svh; padding:clamp(1.5rem,4vw,3rem); gap:1.2rem;
  }
  .wrap{ width:100%; max-width:760px; display:flex; flex-direction:column; gap:1rem; }
  .eyebrow{ font-size:0.7rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--accent); text-align:center; }
  h1{ font-family:var(--f-serif); font-weight:400; font-style:italic;
    font-size:clamp(1.5rem,3.4vw,2rem); text-align:center; margin:0; }
  .stage{ position:relative; width:100%; aspect-ratio:1000/900; overflow:hidden;
    border:1px solid var(--rule); background:#1b1208; }
  .stage svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .caption{ text-align:center; font-size:0.95rem; color:var(--ink-mid); line-height:1.55;
    max-width:56ch; margin:0 auto; }
</style>
